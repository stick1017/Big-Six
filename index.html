<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六合彩玄學命理大師 - 時空交互版</title>
    <style>
        :root { --gold: #ffd700; --bg: #0d0d0d; }
        body { background: var(--bg); color: white; font-family: 'PingFang HK', sans-serif; display: flex; justify-content: center; margin: 0; padding: 10px; }
        .app { max-width: 480px; width: 100%; }
        
        .warning-bar { background: #ffcc00; color: #000; text-align: center; font-weight: bold; font-size: 12px; padding: 5px; border-radius: 5px; margin-bottom: 10px; }
        .section { background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
        h2 { color: var(--gold); font-size: 18px; margin-top: 0; text-align: center; }
        
        label { font-size: 11px; color: #888; display: block; margin: 8px 0 3px; }
        input, select { width: 100%; background: #222; border: 1px solid #444; color: var(--gold); padding: 8px; border-radius: 5px; box-sizing: border-box; }

        /* 號碼球顏色 */
        .balls { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 20px 0; }
        .ball { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); box-shadow: inset -3px -3px 6px rgba(0,0,0,0.4), 2px 2px 5px rgba(0,0,0,0.5); }
        .ball.red { background: radial-gradient(circle at 30% 30%, #ff6b6b, #d32f2f); }
        .ball.blue { background: radial-gradient(circle at 30% 30%, #54a0ff, #2e86de); }
        .ball.green { background: radial-gradient(circle at 30% 30%, #55efc4, #20bf6b); }

        .btn-calculate { background: linear-gradient(45deg, #b8860b, #ffd700); color: black; border: none; padding: 12px; width: 100%; border-radius: 30px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 10px; }
        .result-box { display: none; animation: fadeIn 1s; margin-top: 20px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .analysis-text { font-size: 13px; line-height: 1.6; background: rgba(255,215,0,0.1); border: 1px dashed var(--gold); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="app">
    <div class="warning-bar">🈲 戒除貪念 · 隨緣投注</div>
    <h2>🔮 時空交互命理推演</h2>

    <div class="section">
        <h4 style="margin:0; color:var(--gold)">【先天命格】</h4>
        <label>出生日期 (西元)</label>
        <input type="date" id="birthDate" value="1990-01-01">
        <label>【先天】出生時辰</label>
<select id="birthHour">
    <option value="1">子時 (23-01)</option>
    <option value="2">丑時 (01-03)</option>
    <option value="3">寅時 (03-05)</option>
    <option value="4">卯時 (05-07) - 您校正後的時辰</option>
    <option value="5">辰時 (07-09)</option>
    <option value="6">巳時 (09-11)</option>
    <option value="7">午時 (11-13)</option>
    <option value="8">未時 (13-15)</option>
    <option value="9">申時 (15-17)</option>
    <option value="10">酉時 (17-19)</option>
    <option value="11">戌時 (19-21)</option>
    <option value="12">亥時 (21-23)</option>
</select>

    </div>

    <div class="section">
        <h4 style="margin:0; color:var(--gold)">【後天時機】</h4>
        <label>擬定投注日期</label>
        <input type="date" id="betDate">
        <label>擬定下注時間</label>
        <select id="betHour">
            <option value="2">丑時 (01-03)</option><option value="4">卯時 (05-07)</option>
            <option value="6">巳時 (09-11)</option><option value="8">未時 (13-15)</option>
            <option value="10">酉時 (17-19)</option><option value="12">亥時 (21-23)</option>
        </select>
    </div>

    <button class="btn-calculate" onclick="deriveNumbers()">起卦推演</button>

    <div id="resultArea" class="result-box">
        <div class="balls" id="ballContainer"></div>
        <div class="analysis-text" id="analysis"></div>
    </div>
    
    <div style="font-size:11px; color:#555; text-align:center; margin-top:20px;">
        數據僅供玄學參考，請透過官方渠道理性投注。
    </div>
</div>

<script>
// 設定今日為預設投注日期
document.getElementById('betDate').valueAsDate = new Date();

const ballColors = {
    red: [1, 2, 7, 8, 12, 13, 18, 19, 23, 24, 29, 30, 34, 35, 40, 45, 46],
    blue: [3, 4, 9, 10, 14, 15, 20, 25, 26, 31, 36, 37, 41, 42, 47, 48],
    green: [5, 6, 11, 16, 17, 21, 22, 27, 28, 32, 33, 38, 39, 43, 44, 49]
};

function getBallColor(num) {
    if (ballColors.red.includes(num)) return 'red';
    if (ballColors.blue.includes(num)) return 'blue';
    return 'green';
}

function deriveNumbers() {
    const birth = new Date(document.getElementById('birthDate').value);
    const bet = new Date(document.getElementById('betDate').value);
    const bHour = parseInt(document.getElementById('birthHour').value);
    const tHour = parseInt(document.getElementById('betHour').value);

    // 複雜推演種子：先天(生日+時辰) * 後天(日期+下注時間)
    let seed = (birth.getTime() / 100000) + (bet.getTime() / 100000) + bHour + tHour;
    
    let results = [];
    let attempts = 0;
    
    // 使用擬合算法，讓種子影響隨機數生成
    while(results.length < 6 && attempts < 200) {
        let n = Math.floor(Math.abs(Math.sin(seed++)) * 49) + 1;
        if(!results.includes(n)) results.push(n);
        attempts++;
    }
    results.sort((a, b) => a - b);

    // 渲染球體
    const container = document.getElementById('ballContainer');
    container.innerHTML = '';
    results.forEach(num => {
        const color = getBallColor(num);
        const b = document.createElement('div');
        b.className = `ball ${color}`;
        b.innerText = num;
        container.appendChild(b);
    });

    // 命理分析文本
    const elements = ["金", "木", "水", "火", "土"];
    const myElement = elements[birth.getFullYear() % 5];
    const dayElement = elements[bet.getDate() % 5];
    
    document.getElementById('resultArea').style.display = 'block';
    document.getElementById('analysis').innerHTML = `
        <strong>時空分析報告：</strong><br>
        🎯 您的先天命格屬「${myElement}」，投注當日氣場屬「${dayElement}」。<br>
        ✨ <b>天人合一：</b> ${bHour == tHour ? "生辰與投注時辰重合，靈氣極強！" : "時空能量已注入此組號碼。"}<br>
        🔮 <b>五行建議：</b> 建議穿著 <b>${myElement == '金' ? '白色' : '深色'}</b> 衣物前往投注，以增加磁場感應。
    `;
}
</script>
</body>
</html>
